name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libfreetype6 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Compile application
        run: python -m compileall -q app.py floodguard gui tests

      - name: Import application modules
        run: |
          python -c "import floodguard.runoff, floodguard.hydraulics, floodguard.scenarios, floodguard.reporting, floodguard.project, floodguard.analysis"
          python -c "import gui.theme, gui.main_window, gui.network_view"

      - name: Verify bundled example project
        run: |
          python -c "from pathlib import Path; from floodguard.project import EngineeringProject, create_example_project; path = Path('data/example_project.json'); assert EngineeringProject.load(path).to_dict() == create_example_project().to_dict()"

      - name: Run automated tests
        run: python -m pytest -q
